<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A few questions</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"></head>
<body><main>
<h1>A few questions</h1>
<p>For each statement, write how sure you are that it is true:</p>
<div class="scale">
  <div><b>0</b>definitely false</div>
  <div><b>50</b>no idea</div>
  <div><b>100</b>definitely true</div>
</div>
<p class="muted">There are no right answers. Please give your honest view today, not what you think anyone wants to hear.</p>
<form id="form"></form>
<div id="status"></div>
</main>
<script src="/common.js"></script>
<script>
const form = document.getElementById('form');
const status = document.getElementById('status');
const tp = params.get('tp') || '';

function thanks(title, text) {
  const card = el('div', { class: 'done-card' });
  card.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="var(--accent)"/><path d="M14 25l7 7 13-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  card.append(el('h2', {}, title), el('p', {}, text));
  return card;
}

// How many questions have an answer. It counts answers, never looks at them,
// so it cannot nudge anyone toward a number.
function trackProgress() {
  const inputs = [...form.querySelectorAll('input[type=number]')];
  const fill = el('i', { class: 'fill' });
  const text = el('span', {});
  const bar = el('div', { class: 'progress', 'aria-live': 'polite' }, el('span', { class: 'track' }, fill), text);
  form.before(bar);
  const update = () => {
    const n = inputs.filter((i) => i.value.trim() !== '').length;
    fill.style.width = (100 * n / inputs.length) + '%';
    text.textContent = n + ' of ' + inputs.length + ' answered';
  };
  form.addEventListener('input', update);
  update();
}

(async () => {
  status.replaceChildren(thinking('Loading the questions…'));
  try {
    const d = await api('/api/instrument?t=' + encodeURIComponent(token) + '&tp=' + encodeURIComponent(tp));
    status.replaceChildren();
    if (d.submitted) { form.replaceWith(thanks('Already recorded', 'Your answers are already recorded. Thank you.')); return; }
    d.items.forEach((it, i) => {
      form.append(el('div', { class: 'item', style: 'animation-delay:' + (i * 0.06) + 's' },
        el('label', { for: 'q' + it.key }, it.text),
        el('div', { class: 'num' },
          el('input', { type: 'number', id: 'q' + it.key, name: String(it.key), min: '0', max: '100', step: '1', required: '', inputmode: 'numeric', 'aria-describedby': 'hint' + i }),
          el('span', { id: 'hint' + i }, '0 to 100'))));
    });
    form.append(el('div', { class: 'item optional' },
      el('label', { for: 'open' }, 'What, if anything, changed your thinking? (Write as much or as little as you like.)'),
      el('textarea', { id: 'open', rows: '4' })));
    if (tp === 'delayed') {
      form.append(el('div', { class: 'item optional' },
        el('label', { for: 'by' }, 'Who is filling this in with you, if anyone?'),
        el('input', { type: 'text', id: 'by' })));
    }
    form.append(el('div', { class: 'row' }, el('button', { type: 'submit', id: 'submit' }, 'Submit answers')));
    trackProgress();
  } catch (err) { showError(status, err); }
})();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const scores = {};
  form.querySelectorAll('input[type=number]').forEach((i) => { scores[i.name] = Number(i.value); });
  const by = document.getElementById('by');
  const submit = document.getElementById('submit');
  submit.disabled = true;
  try {
    await api('/api/measure', { method: 'POST', body: JSON.stringify({
      t: token, tp, scores,
      open_response: document.getElementById('open').value,
      collected_by: by ? by.value : null,
    }) });
    document.querySelector('.progress')?.remove();
    const card = thanks('Thank you', 'Thank you — your answers are recorded.');
    // Someone on the self-serve journey goes back to it for the next step.
    let journey = false;
    try { journey = localStorage.getItem('vp-journey') === '1'; } catch {}
    if (journey) card.append(el('div', { class: 'row' }, el('a', { class: 'button', href: '/start.html' }, 'Continue →')));
    form.replaceWith(card);
    status.replaceChildren();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) { submit.disabled = false; showError(status, err); }
});
</script>
</body></html>
