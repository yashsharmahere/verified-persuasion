<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversation</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"></head>
<body class="chat"><main>
<div id="log" aria-live="polite"></div>
<div id="status"></div>
<div class="row end-row" id="done-row" hidden>
  <button class="secondary" id="done" type="button">I'm done talking</button>
  <button id="done-yes" type="button" hidden>Yes, end the conversation</button>
  <button class="secondary" id="done-no" type="button" hidden>Keep talking</button>
</div>
</main>
<div class="composer" id="composer" hidden>
  <form id="form"><textarea id="input" rows="1" placeholder="Type your reply…" aria-label="Your reply"></textarea>
  <button id="send" type="submit">Send</button></form>
</div>
<script src="/common.js"></script>
<script>
const log = document.getElementById('log');
const status = document.getElementById('status');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

let sourceNames = [];
const escapeRe = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/**
 * The AI's text, easier to read: paragraphs, a source's own words set off as
 * a quote, source names in bold. Built from text nodes only; nothing the model
 * writes is ever parsed as HTML.
 */
function formatReply(text) {
  const names = sourceNames.filter(Boolean).sort((a, b) => b.length - a.length).map(escapeRe);
  const pattern = new RegExp('(“[^”]{8,}”|"[^"]{8,}"' + (names.length ? '|' + names.join('|') : '') + ')', 'g');
  // Highlighted means "a source's own words": only in a reply that names a
  // source (the opening quotes the participant, never a source).
  const cited = names.length > 0 && String(text).split(pattern).some((x) => sourceNames.includes(x));
  return String(text).split(/\n\s*\n/).filter((x) => x.trim()).map((para) => {
    const p = el('p');
    const parts = para.trim().split(pattern);
    for (const part of parts) {
      if (!part) continue;
      if (/^[“"]/.test(part) && part.length > 9) p.append(el('q', { class: cited ? 'said' : 'their' }, part.slice(1, -1)));
      else if (names.length && sourceNames.includes(part)) p.append(el('b', { class: 'src-name' }, part));
      else p.append(part);
    }
    return p;
  });
}

function addMessage(speaker, text, sources) {
  const me = speaker === 'participant';
  if (sources) sourceNames = [...new Set([...sourceNames, ...sources.map((x) => x.name)])];
  const bubble = el('div', { class: 'bubble' }, ...(me ? [el('p', {}, text)] : formatReply(text)));
  if (sources && sources.length) {
    const badge = el('span', { class: 'checked stamp-in' });
    badge.innerHTML = CHECK_SVG + 'Every fact checked against';
    const s = el('div', { class: 'sources' }, badge);
    sources.forEach((src) => {
      s.append(el('a', { class: 'source-link', href: src.url, target: '_blank', rel: 'noopener' }, src.name));
    });
    bubble.append(s);
  }
  const who = el('span', { class: 'who' });
  if (me) who.textContent = 'You';
  else who.innerHTML = BRAND_SVG + 'AI assistant';
  const box = el('div', { class: 'msg ' + (me ? 'me' : 'sys') }, who, bubble);
  log.append(box);
  box.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return box;
}

function finish() {
  location.href = '/measure.html?tp=post_treatment&t=' + encodeURIComponent(token);
}

function grow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
}

async function load() {
  status.replaceChildren(thinking('Loading the conversation…'));
  try {
    const s = await api('/api/session?t=' + encodeURIComponent(token));
    status.replaceChildren();
    sourceNames = s.sourceNames || [];
    s.turns.forEach((t) => addMessage(t.speaker, t.text));
    if (s.ended) { finish(); return; }
    document.getElementById('composer').hidden = false;
    document.getElementById('done-row').hidden = false;
    input.focus();
  } catch (err) { showError(status, err); }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  grow();
  send.disabled = input.disabled = true;
  const mine = addMessage('participant', message);
  // The steps every reply goes through, in order. Timing is approximate; the
  // last step stays until the checked reply arrives.
  const stages = ['Writing a reply…', 'Splitting it into single facts…', 'Checking each fact against its source…'];
  const label = el('span', { class: 'stage-label' }, stages[0]);
  const wait = el('div', { class: 'thinking', role: 'status' },
    el('span', { class: 'dots', 'aria-hidden': 'true' }, el('i'), el('i'), el('i')), label);
  let stage = 0;
  const ticker = setInterval(() => {
    if (stage >= stages.length - 1) return clearInterval(ticker);
    label.classList.add('swap');
    setTimeout(() => { label.textContent = stages[++stage]; label.classList.remove('swap'); }, 250);
  }, 3500);
  log.append(wait);
  wait.scrollIntoView({ behavior: 'smooth', block: 'end' });
  status.replaceChildren();
  try {
    const r = await api('/api/turn', { method: 'POST', body: JSON.stringify({ t: token, message }) });
    clearInterval(ticker); wait.remove();
    addMessage('system', r.text, r.sources);
  } catch (err) {
    // Nothing was stored: take the message back so it can be sent again.
    clearInterval(ticker); wait.remove(); mine?.remove();
    input.value = message; grow();
    showError(status, err);
  }
  send.disabled = input.disabled = false;
  input.focus();
});

input.addEventListener('input', grow);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

// Ending is final, so ask on the page itself rather than in a browser pop-up.
const done = document.getElementById('done');
const yes = document.getElementById('done-yes');
const no = document.getElementById('done-no');
function asking(on) { done.hidden = on; yes.hidden = no.hidden = !on; }
done.addEventListener('click', () => { asking(true); yes.focus(); });
no.addEventListener('click', () => { asking(false); input.focus(); });
yes.addEventListener('click', async () => {
  yes.disabled = true;
  try { await api('/api/end', { method: 'POST', body: JSON.stringify({ t: token }) }); finish(); }
  catch (err) { yes.disabled = false; showError(status, err); }
});

load();
</script>
</body></html>
